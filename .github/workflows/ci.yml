name: CI

on:
  pull_request:
  push:
    branches:
      - development/windshield-demand-platform

permissions:
  contents: read

# A superseded run has no value, and an e2e hang used to cost the six-hour default
# job timeout. Cancel the previous run for the same ref instead of paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.3"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv lock --check
      - run: >-
          uv run ruff check src tests scripts/audit_baseline.py
          scripts/build_evidence_snapshot.py scripts/bootstrap_codespaces_preview.py
          scripts/audit_forecast_promotion.py
          scripts/e2e_fixture.py scripts/generate_preview_credentials.py
          scripts/run_codespaces_preview.py scripts/run_e2e_dev.py
          scripts/run_planner_dev.py scripts/run_quarterly_source_research.py
          scripts/replay_registration_reconciliation.py
          scripts/rebuild_active_snapshot.py scripts/run_container_preview.py
          scripts/build_client_snapshot.py
          scripts/preflight_client_evidence.py
      - run: uv run pytest

  planner-web:
    name: Planner web (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.3"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run lint
        working-directory: web
      # Runs before the browser suite: while it sat after `npm run e2e` it was
      # starved by that step's hang and never executed once.
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run openapi:check
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.3"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run pip-audit
